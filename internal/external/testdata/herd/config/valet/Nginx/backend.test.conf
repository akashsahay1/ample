# ISOLATED_PHP_VERSION=8.3
server {
    listen 127.0.0.1:80;
    server_name backend.test www.backend.test *.backend.test;
    root /;
    location ~ [^/]\.php(/|$) {
        fastcgi_pass "$herd_sock_83";
    }
}
server {
    listen 127.0.0.1:443 ssl;
    server_name backend.test www.backend.test *.backend.test;
}
