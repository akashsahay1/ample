# Virtual Hosts
#
# Required modules: mod_log_config

# Use name-based virtual hosting.
#
##NameVirtualHost *:80
#
##<VirtualHost *:80>
    ##ServerAdmin webmaster@dummy-host.example.com
    ##DocumentRoot "C:/xampp/htdocs/dummy-host.example.com"
    ##ServerName dummy-host.example.com
##</VirtualHost>

<VirtualHost *:80>
    DocumentRoot "${SRVROOT}/../htdocs"
    ServerName localhost
</VirtualHost>

<VirtualHost *:80>
    ServerName shop.local
    ServerAlias www.shop.local
    DocumentRoot "${SRVROOT}/../htdocs/My Shop/public"
    <Directory "${SRVROOT}/../htdocs/My Shop/public">
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName shop.local:443
    DocumentRoot "${SRVROOT}/../htdocs/My Shop/public"
    SSLEngine on
</VirtualHost>

<VirtualHost *:80>
    ServerName www.api.example.test
    DocumentRoot C:/does-not-exist/api/public
</VirtualHost>
