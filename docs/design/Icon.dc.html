<div style="width: 1280px; height: 640px; box-sizing: border-box; padding: 56px; display: flex; gap: 56px; background: #F5F3EF">

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 36px">

    </div>
    <div style="display: flex; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 10px">

        <div style="height: 48px; width: 300px; border-radius: 10px; background: #202020; display: flex; align-items: center; justify-content: center; gap: 18px">

          <span style="width: 24px; height: 24px; border-radius: 6px; background: #3A3A3A"></span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 12px; font-weight: 600; color: #5B5F68; text-transform: uppercase; letter-spacing: 0.06em">Tray (running / stopped)</div>
        <div style="height: 48px; width: 220px; border-radius: 10px; background: #202020; display: flex; align-items: center; justify-content: center; gap: 22px">

          <svg viewBox="0 0 24 24" width="18" height="18" aria-label="Tray icon, stopped"><path d="M5 20 L12 4 L19 20" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><rect x="8.5" y="13.5" width="7" height="2.6" rx="1.3" fill="#FFFFFF"></rect><circle cx="19" cy="6" r="3" fill="#8A8E97"></circle></svg>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-label="Tray icon, error"><path d="M5 20 L12 4 L19 20" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><rect x="8.5" y="13.5" width="7" height="2.6" rx="1.3" fill="#FFFFFF"></rect><circle cx="19" cy="6" r="3" fill="#E8622C"></circle></svg>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 12px; font-weight: 600; color: #5B5F68; text-transform: uppercase; letter-spacing: 0.06em">On light (macOS dock later)</div>
        <div style="height: 48px; width: 180px; border-radius: 10px; background: #E9E7E2; border: 1px solid #D8D4CC; display: flex; align-items: center; justify-content: center">
          <svg viewBox="0 0 256 256" width="36" height="36" aria-label="AMPLS on light background"><rect width="256" height="256" rx="58" fill="#16181D"></rect><path d="M70 200 L128 56 L186 200" fill="none" stroke="#F5F3EF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"></path><rect x="113" y="129" width="30" height="12" rx="6" fill="#E8622C"></rect><rect x="104" y="151" width="48" height="12" rx="6" fill="#9AA3FF"></rect><rect x="96" y="173" width="64" height="12" rx="6" fill="#3FA9C9"></rect></svg>
